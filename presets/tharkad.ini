jinja = 1
# Brooke tweaks from AJ
ctx-size = 262144
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

[unsloth/Qwen3-Coder-Next-GGUF:UD-Q4_K_XL]
