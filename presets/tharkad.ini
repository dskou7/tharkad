[*]
# global defaults, currently empty

[Qwen 3.8 27b dense]
model = ./models/web/Qwen3.8-27B-UD-Q8_K_XL.gguf
alias = Qwen 3.8
jinja = 1
# MTP stuff
spec-type = draft-mtp
spec-draft-n-max = 3
# brooke tweaks from AJ, copied to 3.8. Probably should test / tweak more.
ctx-size = 262144
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 0.0
repeat-penalty = 1.0

[Qwen 3.6 27b dense]
model = ./models/web/Qwen3.6-27B-UD-Q8_K_XL.gguf
